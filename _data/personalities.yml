# Personalities flavor reactions and lightly modify stat decay rates.
# Decay multipliers apply to the base tick rate. 1.0 = normal.
# Reaction phrases let the dog feel different across personalities.

- id: friendly
  name: Friendly
  decay:
    hunger: 1.0
    thirst: 1.0
    bladder: 1.0
    energy: 1.0
  reactions:
    pet_positive: ["Tail wags wildly!", "Leans into your hand.", "Happy little wiggle."]
    feed_positive: ["Gobbles it up!", "Tail-wag dance.", "Happy chomps."]
    scold_negative: ["Looks down sadly.", "Tail droops a little."]

- id: shy
  name: Shy
  decay:
    hunger: 0.9
    thirst: 1.0
    bladder: 1.0
    energy: 0.9
  reactions:
    pet_positive: ["Hesitates, then leans in.", "Soft little tail wag.", "Quiet contentment."]
    feed_positive: ["Sniffs first, then eats carefully.", "Quiet chewing."]
    scold_negative: ["Hides behind something.", "Trembles a little."]

- id: energetic
  name: Energetic
  decay:
    hunger: 1.3
    thirst: 1.3
    bladder: 1.2
    energy: 1.4
  reactions:
    pet_positive: ["Bounces in place!", "Spins around twice!", "Tail-helicopter mode."]
    feed_positive: ["INHALES the food.", "Done in three seconds.", "Looks for more!"]
    scold_negative: ["Pauses... then bounces again."]

- id: lazy
  name: Lazy
  decay:
    hunger: 0.8
    thirst: 0.9
    bladder: 0.9
    energy: 0.6
  reactions:
    pet_positive: ["Sighs happily.", "Rolls onto back.", "Closes eyes contentedly."]
    feed_positive: ["Eats slowly, savoring.", "Lazy tail thumps."]
    scold_negative: ["Yawns. Apologizes. Yawns again."]

- id: playful
  name: Playful
  decay:
    hunger: 1.2
    thirst: 1.1
    bladder: 1.1
    energy: 1.2
  reactions:
    pet_positive: ["Play-bows!", "Grabs nearest toy.", "Wiggle-butt!"]
    feed_positive: ["Tosses kibble in the air!", "Excited tail wag."]
    scold_negative: ["Drops the toy. Looks sorry."]

- id: anxious
  name: Anxious
  decay:
    hunger: 1.1
    thirst: 1.2
    bladder: 1.3
    energy: 1.1
  reactions:
    pet_positive: ["Calms down a little.", "Nervous tail wag.", "Leans in for safety."]
    feed_positive: ["Eats quickly, watching around.", "Finishes and looks to you."]
    scold_negative: ["Whines softly.", "Curls up small."]
